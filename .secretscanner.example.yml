scan:
  max_file_size_mb: 5
  entropy: true
  follow_symlinks: false
  workers: 4
  max_files: 50000
  timeout_seconds: 300
  max_findings_per_rule_per_file: 20

exclude:
  - "tests/fixtures/**"
  - "*.min.js"

rules:
  jwt:
    enabled: true
  generic-password:
    severity: high

allowlist:
  paths:
    - "docs/examples/**"
  rules: []
  fingerprints: []

custom_rules:
  - id: internal-token
    name: Internal Token
    description: Organization-specific token format
    regex: "\\bINT_[A-Z0-9]{24}\\b"
    category: internal
    severity: high
    confidence: high
    tags: [internal]
    keywords: [token]
    remediation: Rotate this token and store it outside source control.
